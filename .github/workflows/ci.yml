name: CI

on: push

jobs:
  verificar:
    runs-on: ubuntu-latest

    # Menor privilégio nos três jobs: nenhum deles escreve no repositório, e sem
    # escrita em contents um postinstall comprometido no `npm ci` não tem token com
    # que empurrar commit. Sem este bloco vale o padrão da organização, que costuma
    # ser leitura E escrita. O `persist-credentials: false` do checkout é a outra
    # metade: é ele que tira o token de .git/config, onde um `cat` alcança.
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Sem o health check, os passos começam antes de o banco aceitar conexão
        # e o primeiro teste de banco falha por "connection refused".
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Mesma URL que o docker-compose.yml local. Os testes de packages/db criam e
      # derrubam bancos descartáveis, então precisam do superusuário.
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4
        # O token do checkout não fica no runner: o `npm ci` abaixo roda postinstall
        # de dependência, e nada aqui usa git depois do checkout.
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test

  demonstracao:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        # O token do checkout não fica no runner: o `npm ci` abaixo roda postinstall
        # de dependência, e nada aqui usa git depois do checkout.
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A apps/demo tem tsconfig próprio (Next), fora do typecheck da raiz.
      - run: npm run typecheck:demo

      - run: npm run build:demo

      - run: npx playwright install --with-deps chromium

      - run: npm run e2e:demo

  painel:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        # O token do checkout não fica no runner: o `npm ci` abaixo roda postinstall
        # de dependência, e nada aqui usa git depois do checkout.
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A apps/web tem tsconfig próprio (Next, JSX), fora do typecheck da raiz.
      - run: npm run typecheck:web

      - run: npm run build:web
